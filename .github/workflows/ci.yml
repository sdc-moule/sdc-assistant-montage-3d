name: Vérification du socle
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:standalone
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - run: python tests/e2e/standalone_e2e.py dist-standalone/captures
      - uses: actions/upload-artifact@v4
        with:
          name: SDC-Montage-3D-HTML-autonome
          path: |
            dist-standalone/SDC_Montage_3D.html
            dist-standalone/captures/*.png
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'
        env:
          PYTHONPATH: backend
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: python packaging/windows/build_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: SDC-Atelier-Windows
          path: Installation_Atelier_SDC_v0_2_0.zip
